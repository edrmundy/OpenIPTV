# Fork-only. Keeps the EDTV bridge build in step with upstream OpenIPTV.
#
# Once a day (or by hand), it checks for a new upstream release. When there is
# one, it replays the commits of the `edtv/bridge` branch onto that release,
# runs the tests, builds the ARMv7 APK signed with the same key as the build
# on the TV, and publishes it as a release named `edtv-<upstream tag>`.
#
# A rebase conflict or a failed check fails the run instead (GitHub emails the
# owner), with the details in the run summary, and nothing is published. Installing on the TV stays a local step (EDTV's
# scripts/openiptv-update.sh).
#
# Rollback: the TV refuses a downgrade (release builds are not debuggable), so
# a rollback is the older bridge rebuilt with a higher build number. Run the
# workflow by hand with `ref` set to a previous bridge (tags
# edtv-bridge-on-<tag> keep each one) and `build_number` above the installed
# build. It publishes edtv-rollback-<build number> and leaves edtv/bridge alone.
#
# Secret: EDTV_SIGNING_KEYSTORE_B64 is the base64 of the debug keystore that
# signed the installed app (standard debug alias and passwords).
name: EDTV bridge build

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if a release for the upstream tag already exists"
        type: boolean
        default: false
      ref:
        description: "Rollback only: build this ref as it is (no rebase)"
        type: string
        default: ""
      build_number:
        description: "Rollback only: build number, above the one on the TV"
        type: string
        default: ""
      allow_schema_change:
        description: "Allow a new upstream release that raises the database schema version (a one-way upgrade on the TV)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: edtv-bridge
  cancel-in-progress: false

env:
  UPSTREAM: Hunter-Clipper/OpenIPTV
  BRIDGE: edtv/bridge
  # SHA-256 of the signing certificate of the app installed on the TV.
  EXPECTED_CERT: 8ddcd2ad5df4e4566e21560127fca4fd823579bad4a5352c51c2179bdf12c7b8
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the bridge branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || env.BRIDGE }}
          fetch-depth: 0

      - name: Decide what to build
        id: plan
        env:
          IN_REF: ${{ inputs.ref }}
          IN_BUILD: ${{ inputs.build_number }}
          IN_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --quiet --tags upstream
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          # The bridge's upstream base is where it joins the upstream release, not the
          # nearest v* tag: upstream deletes old tags, so the nearest one can be stale.
          base=$(git merge-base HEAD "$latest^{commit}")
          base_name=$(git describe --tags --exact-match --match 'v*' "$base" 2>/dev/null \
            || git rev-parse --short=12 "$base")
          latest_name=$latest
          release="edtv-$latest"
          replay=true
          [ "$base" = "$(git rev-parse "$latest^{commit}")" ] && replay=false
          if [ -n "${IN_REF:-}" ]; then
            # Rollback: build the given ref unchanged, under a new build number.
            [[ "${IN_BUILD:-}" =~ ^[0-9]+$ ]] || { echo "A rollback needs a numeric build_number"; exit 1; }
            latest=$base
            latest_name=$base_name
            release="edtv-rollback-$IN_BUILD"
            replay=false
          fi
          echo "upstream=$latest_name base=$base_name ($base) replay=$replay release=$release"
          echo "Bridge commits to replay:"
          git log --oneline "$base..HEAD" --not "$latest^{commit}" || true
          if gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              && [ "${IN_FORCE:-false}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release $release already exists; nothing to do."
            exit 0
          fi
          {
            echo "skip=false"
            echo "latest=$latest"
            echo "base=$base"
            echo "base_name=$base_name"
            echo "latest_name=$latest_name"
            echo "replay=$replay"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      - name: Replay the bridge on the new release
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.replay == 'true'
        env:
          LATEST: ${{ steps.plan.outputs.latest }}
          BASE: ${{ steps.plan.outputs.base }}
          BASE_NAME: ${{ steps.plan.outputs.base_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rebase --onto "$LATEST" "$BASE"; then
            files=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
            commit=$(git log -1 --format='%h %s' REBASE_HEAD 2>/dev/null || true)
            git rebase --abort
            printf '### The bridge does not replay on %s\n\nIt was on %s. Stopped at: %s\n\nConflicting files:\n%s\n' \
              "$LATEST" "$BASE_NAME" "$commit" "$files" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git log --oneline "$LATEST..HEAD"

      - name: Database schema check
        id: schema
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.replay == 'true'
        env:
          LATEST: ${{ steps.plan.outputs.latest }}
          BASE: ${{ steps.plan.outputs.base }}
          ALLOW: ${{ inputs.allow_schema_change }}
        run: |
          set -euo pipefail
          # OpenIPTV upgrades its database on first start, and a downgrade is impossible (the TV
          # refuses an older build and an uninstall deletes the data). So a release that raises the
          # schema version is one-way: stop here, before anything is published or force-pushed,
          # unless the run was started by hand with allow_schema_change.
          ver() { git show "$1:lib/core/storage/database.dart" | sed -n 's/.*int get schemaVersion => \([0-9][0-9]*\);.*/\1/p' | head -1; }
          old=$(ver "$BASE"); new=$(ver "$LATEST")
          [[ "$old" =~ ^[0-9]+$ && "$new" =~ ^[0-9]+$ ]] || { echo "Cannot read the database schema version ($old -> $new); stopping to be safe."; exit 1; }
          echo "note=Database schema: $old -> $new" >> "$GITHUB_OUTPUT"
          if [ "$old" != "$new" ]; then
            if [ "${ALLOW:-false}" != "true" ]; then
              printf '### Database upgrade needs approval\n\nUpstream %s raises the OpenIPTV database schema from %s to %s. The upgrade runs on the TV at first start and cannot be undone.\n\nNothing was merged or published. Back up the TV, then run this workflow by hand with allow_schema_change.\n' \
                "$LATEST" "$old" "$new" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Schema change $old -> $new allowed by hand."
          fi

      - name: Set up Java
        if: steps.plan.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        if: steps.plan.outputs.skip == 'false'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze and test
        if: steps.plan.outputs.skip == 'false'
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build the signed APK
        if: steps.plan.outputs.skip == 'false'
        env:
          KEYSTORE_B64: ${{ secrets.EDTV_SIGNING_KEYSTORE_B64 }}
          RELEASE: ${{ steps.plan.outputs.release }}
          IN_BUILD: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "EDTV_SIGNING_KEYSTORE_B64 is not set"; exit 1; }
          key="$RUNNER_TEMP/edtv-signing.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$key"
          # Standard Android debug-key alias and passwords; the keystore itself is the secret.
          printf 'storeFile=%s\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' \
            "$key" > android/key.properties
          # The TV refuses a lower build number. A rollback build (edtv-rollback-N) sits
          # above upstream's number, so later normal builds must go above it too.
          if [ -n "${IN_BUILD:-}" ]; then
            [[ "$IN_BUILD" =~ ^[0-9]+$ ]] || { echo "build_number must be a number"; exit 1; }
            build="$IN_BUILD"
          else
            up=$(sed -n 's/^version: .*+\([0-9][0-9]*\)$/\1/p' pubspec.yaml)
            [[ "$up" =~ ^[0-9]+$ ]] || { echo "No build number in pubspec.yaml"; exit 1; }
            rb=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
              --jq '[.[].tagName | select(startswith("edtv-rollback-")) | ltrimstr("edtv-rollback-") | tonumber] | max // 0')
            build=$(( up > rb ? up : rb + 1 ))
          fi
          echo "build number: $build"
          flutter build apk --release --target-platform android-arm --build-number "$build"
          rm -f android/key.properties "$key"
          apk="$RUNNER_TEMP/openiptv-$RELEASE-armv7.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cert=$("$bt/apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [ "$cert" != "$EXPECTED_CERT" ]; then
            echo "Signed with the wrong key ($cert); it would not install over the TV's app."
            exit 1
          fi
          pkg=$("$bt/aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          [ "$pkg" = "com.openiptv.app.diagnostic" ] || { echo "Unexpected package $pkg"; exit 1; }
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$apk")" > "$(basename "$apk").sha256")
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Publish the branch and the release
        if: steps.plan.outputs.skip == 'false'
        env:
          LATEST: ${{ steps.plan.outputs.latest }}
          LATEST_NAME: ${{ steps.plan.outputs.latest_name }}
          BASE_NAME: ${{ steps.plan.outputs.base_name }}
          REPLAY: ${{ steps.plan.outputs.replay }}
          RELEASE: ${{ steps.plan.outputs.release }}
          SCHEMA_NOTE: ${{ steps.schema.outputs.note }}
        run: |
          set -euo pipefail
          if [ "$REPLAY" = "true" ]; then
            # Keep the previous bridge reachable for a rollback.
            git tag -f "edtv-bridge-on-$BASE_NAME" "origin/$BRIDGE"
            git push origin "refs/tags/edtv-bridge-on-$BASE_NAME"
            git push --force-with-lease="$BRIDGE:origin/$BRIDGE" origin "HEAD:refs/heads/$BRIDGE"
          fi
          notes=$(printf 'Upstream %s with the EDTV bridge (fork-only).\n\nBridge commits:\n%s\n\n%s\n\nInstall on the TV with EDTV'"'"'s `scripts/openiptv-update.sh`.' \
            "$LATEST_NAME" "$(git log --format='- %s' "$LATEST..HEAD")" "$(flutter --version | head -1)")
          notes=$(printf '%s\n\n%s' "$notes" "${SCHEMA_NOTE:-Database schema: unchanged}")
          gh release delete "$RELEASE" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" \
            --title "OpenIPTV $LATEST_NAME + EDTV bridge" --notes "$notes"
